name: Sync subtree branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-subtree-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate backend and frontend branches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate and safely synchronize subtree branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backend frontend
          backend="$(git subtree split --prefix=backend HEAD)"
          frontend="$(git subtree split --prefix=frontend HEAD)"

          # Preserve any independent branch history; never replace it.
          for branch in backend frontend; do
            candidate="${!branch}"
            if ! git merge-base --is-ancestor "origin/$branch" "$candidate"; then
              echo "::error::$branch has diverged; refusing to overwrite its history."
              exit 1
            fi
          done

          # Both refs update together, using only ordinary fast-forward pushes.
          git push --atomic origin "$backend:refs/heads/backend" "$frontend:refs/heads/frontend"
          git fetch origin backend frontend
          for branch in backend frontend; do
            expected="$(git rev-parse "HEAD:$branch")"
            actual="$(git rev-parse "origin/$branch^{tree}")"
            test "$expected" = "$actual"
            echo "$branch tree verified: $actual"
          done
