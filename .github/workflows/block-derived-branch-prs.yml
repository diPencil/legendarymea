name: Block derived branch pull requests

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  block-derived-branch-pr:
    name: Close derived branch pull requests to main
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.head.ref == 'backend' ||
       github.event.pull_request.head.ref == 'frontend')

    steps:
      - name: Comment and close pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "This branch is generated automatically from main and must not be merged back into main. Make changes in main instead."
          gh pr close "$PR_URL"
